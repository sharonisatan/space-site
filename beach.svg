<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A quiet beach at golden hour: violet sky, turquoise sea and pale sand">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9ee8"/>
      <stop offset=".45" stop-color="#c9c4f4"/>
      <stop offset=".78" stop-color="#f4dcf0"/>
      <stop offset="1" stop-color="#ffe2c4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffd9a1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffd9a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5570"/>
      <stop offset=".35" stop-color="#1f7f96"/>
      <stop offset=".75" stop-color="#3fb0ac"/>
      <stop offset="1" stop-color="#7fcfc2"/>
    </linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c6a8"/>
      <stop offset="1" stop-color="#ecd6b6"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eed2a7"/>
      <stop offset="1" stop-color="#d3a877"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="440" fill="url(#sky)"/>
  <circle cx="1148" cy="236" r="300" fill="url(#glow)"/>
  <circle cx="1148" cy="236" r="58" fill="#fff6e4" opacity=".92"/>
  <g fill="#ffffff">
    <ellipse cx="300" cy="138" rx="190" ry="24" opacity=".30"/>
    <ellipse cx="470" cy="104" rx="118" ry="15" opacity=".20"/>
    <ellipse cx="980" cy="178" rx="156" ry="19" opacity=".22"/>
    <ellipse cx="1360" cy="120" rx="130" ry="16" opacity=".18"/>
  </g>

  <!-- sea -->
  <rect y="440" width="1600" height="232" fill="url(#sea)"/>
  <!-- haze softening the horizon line -->
  <rect y="414" width="1600" height="52" fill="#ffe8cf" opacity=".28"/>
  <g fill="none" stroke="#dff5ef" stroke-linecap="round">
    <path d="M0 474q200-10 400 0t400 0 400 0 400 0" stroke-width="3" opacity=".22"/>
    <path d="M0 514q220 14 440 0t440 0 440 0" stroke-width="4" opacity=".24"/>
    <path d="M0 560q260-16 520 0t520 0 520 0" stroke-width="5" opacity=".26"/>
    <path d="M0 612q300 18 600 0t600 0 600 0" stroke-width="6" opacity=".30"/>
  </g>
  <!-- sun on the water -->
  <g fill="#fff4dc">
    <ellipse cx="1148" cy="462" rx="54" ry="5" opacity=".45"/>
    <ellipse cx="1138" cy="500" rx="78" ry="6" opacity=".34"/>
    <ellipse cx="1160" cy="546" rx="104" ry="7" opacity=".26"/>
    <ellipse cx="1132" cy="600" rx="132" ry="8" opacity=".20"/>
  </g>

  <!-- shore foam -->
  <path d="M0 676q140-30 290-12t300 6 300-22 310 8 400-6v44H0z" fill="#ffffff" opacity=".62"/>
  <path d="M0 700q180-20 330-4t320 2 300-16 330 10 320-4v40H0z" fill="#ffffff" opacity=".38"/>

  <!-- wet sand, then dry sand -->
  <path d="M0 724q200-22 400-6t400 4 400-14 400 8v60H0z" fill="url(#wet)"/>
  <path d="M0 774q220-26 440-8t440 2 420-12 300 10V1000H0z" fill="url(#sand)"/>
  <g fill="#c9a278" opacity=".22">
    <ellipse cx="420" cy="862" rx="150" ry="10"/>
    <ellipse cx="1120" cy="922" rx="210" ry="12"/>
  </g>
</svg>
